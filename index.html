<!doctype html><html><head><meta charset=utf8><meta name=theme-color content="#06302f"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Letícia Godoy Nails</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@300;400;500&display=swap">
<style id="css">
/* Layout: coluna única estreita (celular primeiro). Área da cliente e área da profissional na mesma página, trocadas pelo hash. */
:root{
  --bg:#ffffff; --bg2:#fbf8f1; --surface:#ffffff; --surface2:#fdfbf6; --line:#ecdfc0;
  --fg:#3f3f3f; --muted:#7d7d7d; --gold:#d9a42c; --btn1:#b38f42; --btn2:#d9bf7e; --btnfg:#ffffff;
  --ok:#2f6b4a; --bad:#9a3b32; --wa:#dcf3c8; --wafg:#1f2a1a; --wahead:#2a4a3b; --focus:#b38f42;
  --display:"Cormorant Garamond",Georgia,serif; --body:"Poppins",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:300 15px/1.55 var(--body);
  background-image:radial-gradient(60% 40% at 90% 0%,color-mix(in srgb,var(--gold) 16%,transparent),transparent),
                   radial-gradient(50% 35% at 0% 60%,color-mix(in srgb,var(--gold) 12%,transparent),transparent);
  background-attachment:fixed;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--gold)}
.brand{text-align:center;display:grid;justify-items:center;gap:6px;margin-bottom:22px}
.mono{width:62px;height:62px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;
  font:500 30px/1 var(--display);color:var(--gold)}
.name{margin:6px 0 0;font:500 30px/1.1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.sub{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.feature{position:relative;text-align:center;padding:26px 22px 24px;margin-bottom:26px;border:1px solid var(--line);
  border-radius:26px 26px 26px 8px;background:linear-gradient(160deg,var(--surface),var(--surface2))}
.feature .small{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.feature .title{margin:0;font:600 34px/1.05 var(--display);letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.feature .hl{margin:6px 0 0;font:italic 500 28px/1.1 var(--display);color:var(--gold)}
.feature .foot{margin:12px 0 0;color:var(--fg)}
.script{font:italic 500 30px/1.15 var(--display);text-align:center;margin:0 0 4px}
.lead{text-align:center;color:var(--muted);margin:0 0 18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.lbl{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:400 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 14px;cursor:pointer}
.chip[aria-pressed="true"],.day[aria-pressed="true"],.slot[aria-pressed="true"]{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:var(--btnfg);border-color:transparent}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.day{flex:0 0 64px;display:grid;gap:1px;justify-items:center;padding:9px 4px;border:1px solid var(--line);background:var(--surface2);border-radius:14px;cursor:pointer}
.day b{font:500 20px/1.1 var(--display)} .day small{font-size:11px}.day i{font-style:normal;font-size:10px;opacity:.8}
.day:disabled{opacity:.45;cursor:not-allowed}.day:disabled b,.day:disabled small{text-decoration:line-through}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 14px;cursor:pointer;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);margin:0}
.field{display:grid;gap:5px;margin-bottom:12px}
.field>span{font-size:12px;color:var(--muted)}
input[type=text],input[type=password],input[type=tel],input[type=time],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 13px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;cursor:pointer;border-radius:999px;padding:14px 18px;
  font:400 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--btnfg);background:linear-gradient(135deg,var(--btn1),var(--btn2))}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.dark-on-dark{color:inherit}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;cursor:pointer}
.center{text-align:center}.foot-links{display:flex;justify-content:center;gap:18px;margin-top:22px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.sent h2{font:italic 500 32px/1.1 var(--display);margin:0 0 6px;text-align:center}
/* whatsapp */
.bubble{background:var(--wa);color:var(--wafg);border-radius:12px 12px 12px 3px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font:400 14px/1.45 var(--body);margin:0}
.bubble:empty::before{content:"(sem mensagem pronta: o WhatsApp abre vazio)";opacity:.7;font-style:italic}
.chat{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.chat .who{background:var(--wahead);color:#fff;padding:8px 12px;font:400 13px var(--body)}
.chat .body{padding:10px;background:color-mix(in srgb,var(--wa) 30%,var(--bg))}
/* pro */
.protop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.protop h1{margin:0;font:600 28px/1 var(--display)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tab{flex:1 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap;font-size:13px}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:var(--btnfg);border-color:transparent}
.ins{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.ins button{border:1px dashed var(--gold);background:transparent;border-radius:8px;padding:3px 8px;font:400 12px var(--body);cursor:pointer;color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wd{display:flex;gap:6px;flex-wrap:wrap}
.wd button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}
.wd button[aria-pressed="true"]{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:var(--btnfg);border-color:transparent}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.savebar{position:sticky;bottom:0;margin-top:16px;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);display:grid;gap:8px;
  box-shadow:0 -6px 20px color-mix(in srgb,var(--fg) 8%,transparent)}
.status{font-size:12.5px;text-align:center;color:var(--muted);min-height:18px}
.status.err{color:var(--bad)}.status.good{color:var(--ok)}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.chip,.day,.slot,.btn{transition:background .15s,transform .1s}.btn:active{transform:scale(.99)}}

/* Detalhes dourados (folhas de ouro, como na arte) */
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%}
body::before{width:190px;height:190px;top:-80px;right:-70px;
  background:radial-gradient(circle at 30% 30%,#f6ead0,#e0c887 45%,#b8964f 100%);opacity:.9;
  box-shadow:0 0 0 14px color-mix(in srgb,#d9a42c 14%,transparent),0 0 0 15px color-mix(in srgb,#d9a42c 35%,transparent)}
body::after{width:230px;height:230px;left:-140px;top:55%;
  background:radial-gradient(circle at 70% 30%,#f6ead0,#e0c887 45%,#b8964f 100%);opacity:.8;
  box-shadow:0 0 0 16px color-mix(in srgb,#d9a42c 12%,transparent),0 0 0 17px color-mix(in srgb,#d9a42c 30%,transparent)}
#app{position:relative;z-index:1}
/* Selecionado: dourado metálico com brilho suave */
.chip,.day,.slot,.tab{transition:box-shadow .3s,border-color .3s,transform .2s}
.chip:hover,.day:not(:disabled):hover,.slot:hover{border-color:var(--gold)}
.chip[aria-pressed="true"],.day[aria-pressed="true"],.slot[aria-pressed="true"],.tab[aria-selected="true"]{
  background:linear-gradient(115deg,#c28f1f 0%,#f3d27a 30%,#d9a42c 50%,#f3d27a 70%,#c28f1f 100%);
  background-size:220% 100%;color:#fff;text-shadow:0 1px 1px rgba(90,65,20,.35);border-color:transparent;
  box-shadow:0 0 0 1px rgba(232,186,80,.55),0 4px 14px rgba(217,164,44,.45),0 0 18px rgba(245,213,122,.35);
  animation:brilho 4.5s ease-in-out infinite}
@keyframes brilho{0%,100%{background-position:0% 50%;box-shadow:0 0 0 1px rgba(232,186,80,.5),0 4px 12px rgba(217,164,44,.4),0 0 14px rgba(245,213,122,.28)}
  50%{background-position:100% 50%;box-shadow:0 0 0 1px rgba(226,198,126,.7),0 4px 16px rgba(217,164,44,.5),0 0 24px rgba(236,210,140,.5)}}
.btn:not(.ghost):not(.bad):not(.ok){box-shadow:0 4px 14px rgba(217,164,44,.35)}
@media (prefers-reduced-motion:reduce){.chip[aria-pressed="true"],.day[aria-pressed="true"],.slot[aria-pressed="true"],.tab[aria-selected="true"]{animation:none}}

/* serviços, pedidos */
.chip small{display:block;font-size:11px;opacity:.75;margin-top:1px}
.chip[aria-pressed="true"] small{opacity:.95}
.svchead,.svcrow{display:grid;grid-template-columns:1fr 78px 62px 34px;gap:6px;align-items:center;margin-bottom:8px}
.svchead{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.svcrow input{padding:9px 10px;min-width:0}
.svcrow .x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--bad);font-size:18px;line-height:1;cursor:pointer}
.bk{padding:14px}
.bkh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.bkh b{font:600 20px/1.1 var(--display)}
.bkm{margin:0 0 10px;font-size:13.5px}.bkm .tel{color:var(--muted);font-size:12.5px}
.tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.pendente{color:#8a6a1f;border-color:#e3cd8c;background:#fbf4de}.tag.confirmado{color:var(--ok);border-color:#b9d8c6;background:#eef7f1}
.tag.recusado,.tag.cancelado{color:var(--bad);border-color:#e4bcb6;background:#fbefed}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.acts .btn{flex:1 1 0}
.btn.sm{padding:11px 14px;display:block;width:auto}
.actpanel{border-top:1px solid var(--line);padding-top:12px}

/* Tema verde e dourado */
:root{color-scheme:dark;
  --bg:#06302f; --bg2:#0a3a38; --surface:#0b403f; --surface2:#0e4947; --line:rgba(226,180,76,.38);
  --fg:#f4ecd8; --muted:#b4c4ba; --gold:#e2b44c; --btn1:#c28f1f; --btn2:#f3d27a; --btnfg:#0b2b27;
  --ok:#8fe0ad; --bad:#ffa497; --focus:#f3d27a}
body{background-color:var(--bg)}
.brand{margin-bottom:24px}
.logo{display:block;width:min(100%,300px);height:auto;border-radius:22px;border:1px solid var(--gold);
  box-shadow:0 0 0 5px rgba(226,180,76,.12),0 10px 30px rgba(0,0,0,.35)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chip[aria-pressed="true"],.day[aria-pressed="true"],.slot[aria-pressed="true"],.tab[aria-selected="true"],.wd button[aria-pressed="true"]{color:#0b2b27;text-shadow:none;font-weight:500}
.btn.bad{background:#9a3b32;color:#fff}.btn.ok{background:#2f6b4a;color:#fff}
.btn.ghost{color:var(--fg)}
.btn:not(.ghost):not(.bad):not(.ok){font-weight:500;border:1px solid rgba(255,240,200,.35)}
.feature{background:linear-gradient(160deg,#0d4b49,#08393a);border-color:var(--gold);box-shadow:0 0 0 4px rgba(226,180,76,.1)}
.feature .title{color:var(--fg)}
.panel,.savebar{border-color:var(--line)}
.savebar{box-shadow:0 -6px 20px rgba(0,0,0,.35)}
input,textarea,select{color-scheme:dark}
::placeholder{color:#8aa39a}
.tag.pendente{color:#f1d58a;border-color:#a8873f;background:rgba(226,180,76,.14)}
.tag.confirmado{color:var(--ok);border-color:#3f8a62;background:rgba(80,180,120,.14)}
.tag.recusado,.tag.cancelado{color:var(--bad);border-color:#a8574d;background:rgba(220,100,90,.14)}

/* Acabamento premium */
body{background-image:radial-gradient(70% 38% at 50% 0%,rgba(30,110,100,.55),transparent),radial-gradient(60% 40% at 100% 70%,rgba(226,180,76,.10),transparent),radial-gradient(50% 35% at 0% 40%,rgba(226,180,76,.08),transparent)}
.brand{gap:0;margin:4px 0 26px;padding:26px 14px 18px;border-radius:30px;position:relative;
  background:radial-gradient(80% 70% at 50% 25%,rgba(22,96,90,.65),rgba(5,38,38,.9));
  border:1px solid rgba(226,180,76,.55);box-shadow:inset 0 0 0 6px rgba(6,48,47,.9),inset 0 0 0 7px rgba(226,180,76,.28),0 18px 40px rgba(0,0,0,.4)}
.logo{width:min(100%,330px);height:auto;border:0;border-radius:0;box-shadow:none;background:none;overflow:visible}
.orn{display:flex;align-items:center;gap:10px;width:70%;margin-top:6px;color:var(--gold)}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.orn i:last-child{transform:scaleX(-1)}
.orn b{font-size:9px;font-weight:400}
.script,.sent h2{background:linear-gradient(115deg,#d9a42c,#fbe089 45%,#d9a42c 70%,#f5d57a);-webkit-background-clip:text;background-clip:text;color:transparent}
.script{font-size:34px}
.lead{letter-spacing:.04em}
.panel{border-radius:20px;background:linear-gradient(165deg,rgba(14,73,71,.92),rgba(8,57,58,.92));box-shadow:0 8px 22px rgba(0,0,0,.25),inset 0 1px 0 rgba(251,224,137,.12)}
.lbl{color:var(--gold);letter-spacing:.24em}
.chip,.day,.slot{background:rgba(5,38,38,.55)}
input[type=text],input[type=password],input[type=tel],input[type=time],input[type=number],textarea,select{background:rgba(5,38,38,.6)}
.btn:not(.ghost):not(.bad):not(.ok){letter-spacing:.2em;padding:16px 18px;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 1px rgba(251,224,137,.35) inset}

body::before{top:0;right:0;left:auto}
body::after{top:auto;bottom:0;left:0;right:auto;transform:rotate(180deg)}
@media (max-width:480px){body::before,body::after{width:150px;height:150px;opacity:.65}}
/* Cabeçalho mais discreto e elegante */
.brand{background:none;border:0;box-shadow:none;padding:6px 0 0;margin:0 0 18px}
.logo{width:min(70%,230px)}
.orn{width:56%;margin-top:10px}

/* Animações sutis */
body::before{transform-origin:100% 0;animation:swayA 8s ease-in-out infinite}
body::after{transform-origin:0 100%;animation:swayB 9s ease-in-out infinite}
@keyframes swayA{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
@keyframes swayB{0%,100%{transform:rotate(178.2deg)}50%{transform:rotate(181.8deg)}}
.logo{animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(245,213,122,0))}50%{filter:drop-shadow(0 0 7px rgba(245,213,122,.4))}}
@media (prefers-reduced-motion:reduce){body::before,body::after,.logo{animation:none}}

/* ===== Animações elegantes ===== */
.logo g text,.logo path,.logo rect,.logo>text{transform-box:fill-box;transform-origin:center}
body.intro .logo g text:nth-of-type(1){animation:lgIn 1.1s cubic-bezier(.2,.7,.2,1) .15s both}
body.intro .logo g text:nth-of-type(2){animation:lgIn 1.1s cubic-bezier(.2,.7,.2,1) .45s both}
body.intro .logo g path{stroke-dasharray:420;animation:draw 1.8s ease-in-out .8s both}
body.intro .logo g text:nth-of-type(3){animation:spread 1.8s cubic-bezier(.2,.7,.2,1) 1.2s both}
body.intro .logo rect{animation:grow 1.2s ease 1.9s both}
body.intro .logo>text{animation:fadeUp 1s ease 2.1s both}
body.intro .orn{animation:fadeUp 1s ease 2.4s both}
@keyframes lgIn{from{opacity:0;transform:translateY(26px) scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes draw{from{stroke-dashoffset:420;opacity:0}15%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes spread{from{opacity:0;letter-spacing:16px}to{opacity:1;letter-spacing:6px}}
@keyframes grow{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* título com letras que surgem e brilho dourado passando */
.script{background-size:220% 100%;animation:shine 6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.script .lt{display:inline-block;color:#f5d57a;-webkit-text-fill-color:#f5d57a}
body.intro .script .lt{animation:letter .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes letter{from{opacity:0;transform:translateY(22px) rotate(4deg);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
body.intro .lead{animation:fadeUp 1s ease 1.6s both}
/* painéis entram em cascata */
body.intro #app .panel{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
body.intro #app .panel:nth-of-type(1){animation-delay:1.9s}
body.intro #app .panel:nth-of-type(2){animation-delay:2.15s}
body.intro #app .panel:nth-of-type(3){animation-delay:2.4s}
body.intro #app .panel:nth-of-type(4){animation-delay:2.65s}
/* interações */
.chip,.day,.slot,.btn,.tab{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,background .3s,border-color .3s}
@media (hover:hover){.chip:hover,.day:hover,.slot:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 18px rgba(0,0,0,.35),0 0 14px rgba(226,180,76,.25)}}
.chip:active,.day:active,.slot:active,.btn:active{transform:scale(.96)}
.chip[aria-pressed="true"],.day[aria-pressed="true"],.slot[aria-pressed="true"]{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
/* brilho que passa no botão principal */
.btn:not(.ghost):not(.bad):not(.ok){position:relative;overflow:hidden}
.btn:not(.ghost):not(.bad):not(.ok)::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 5s ease-in-out 2.5s infinite}
@keyframes sheen{0%,70%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
/* brilhos dourados no fundo */
#sparks{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sparks i{position:absolute;color:#f5d57a;font-style:normal;opacity:0;text-shadow:0 0 8px rgba(245,213,122,.8);animation:twinkle 5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.85;transform:scale(1) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function parseDate(txt){
  txt=String(txt||'').toLowerCase(); const now=new Date(); now.setHours(0,0,0,0); let day,mon;
  let m=txt.match(/(\d{1,2})\s*(?:de\s+)?([a-zç]+)/);
  if(m&&MO.indexOf(m[2])>=0){day=+m[1];mon=MO.indexOf(m[2]);}
  else if((m=txt.match(/(\d{1,2})\s*\/\s*(\d{1,2})/))){day=+m[1];mon=+m[2]-1;}
  else return '';
  if(day<1||day>31||mon<0||mon>11) return '';
  let d=new Date(now.getFullYear(),mon,day); if(d.getMonth()!==mon) return '';
  if(d<new Date(now.getTime()-2*864e5)) d=new Date(now.getFullYear()+1,mon,day);
  return iso(d);
}

/* ---------- pedidos (guardados no db, privados da profissional) ---------- */
let DB=null, BK=[], bkReady=false, bkErr='', dbStarted=false, openAct=null, openMsg=null, msgDraft='';
const STATUS_LBL={pendente:'Aguardando',confirmado:'Confirmado',recusado:'Recusado',cancelado:'Cancelado'};
const ACT={ok:{key:'confirmacao',st:'confirmado',txt:'Abrir WhatsApp e confirmar',cls:'ok'},no:{key:'recusa',st:'recusado',txt:'Abrir WhatsApp e recusar',cls:'bad'},cancel:{key:'cancelamento',st:'cancelado',txt:'Abrir WhatsApp e cancelar',cls:'bad'}};
const bkVars=b=>({nome:b.nome,servico:b.servico,data:b.data,hora:b.hora,whatsapp:b.tel,valor:b.valor});
const cmp=(a,b)=>String((a.iso||'')+(a.hora||'')).localeCompare(String((b.iso||'')+(b.hora||'')));

function bkCard(b,mode){
  const mbtn=`<button type="button" class="btn ghost sm" data-msg="${b.id}">Mensagem</button>`;
  const acts=mode==='pend'?`<button type="button" class="btn ok sm" data-act="ok" data-id="${b.id}">Confirmar</button><button type="button" class="btn bad sm" data-act="no" data-id="${b.id}">Recusar</button>${mbtn}`
    :mode==='conf'?`<button type="button" class="btn bad sm" data-act="cancel" data-id="${b.id}">Cancelar agendamento</button>${mbtn}`
    :`${mbtn}<button type="button" class="linkbtn" data-del="${b.id}">Excluir da lista</button>`;
  let panel='';
  if(openMsg===b.id) panel=`<div class="actpanel"><label class="field"><span>Mensagem para ${esc(b.nome)}</span><textarea id="freeMsg" rows="4" placeholder="Escreva sua mensagem">${esc(msgDraft)}</textarea></label>
      <button class="btn sm" type="button" data-sendmsg="${b.id}" style="width:100%">Enviar pelo WhatsApp</button>
      <p class="center" style="margin:8px 0 0"><button type="button" class="linkbtn" data-back="1">Fechar</button></p></div>`;
  else if(openAct&&openAct.id===b.id){const a=ACT[openAct.act], msg=fill(S.msgs[a.key],bkVars(b));
    panel=`<div class="actpanel"><p class="hint" style="margin:0 0 8px">Mensagem para ${esc(b.nome)}:</p><p class="bubble">${waFmt(msg)}</p>
      <a class="btn ${a.cls}" data-go="${openAct.act}" data-id="${b.id}" href="${esc(wa(clientNum(b.tel),msg))}" target="_blank" rel="noopener" style="margin-top:10px">${a.txt}</a>
      <p class="center" style="margin:8px 0 0"><button type="button" class="linkbtn" data-back="1">Voltar</button></p></div>`;}
  return `<div class="panel bk"><div class="bkh"><b>${esc(b.nome)}</b><span class="tag ${esc(b.status)}">${STATUS_LBL[b.status]||esc(b.status)}</span></div>
    <p class="bkm">${esc(b.data)} · <b>${esc(b.hora)}</b><br>${esc(b.servico)}${b.valor?' · '+esc(b.valor):''}<br><span class="tel">${esc(b.tel)}</span></p>
    ${panel?'':`<div class="acts">${acts}</div>`}${panel}</div>`;
}
function paintBookings(){
  const box=$('#bkList'); if(!box) return;
  if(!DB){ box.innerHTML=`<div class="panel"><p class="empty">${!SBOK?'Protótipo: os pedidos aparecerão aqui quando o banco de dados for conectado.':dbStarted?'Os pedidos precisam do login na sua conta. Abra o site pelo seu acesso.':'Carregando…'}</p></div>`; return; }
  if(!bkReady){ box.innerHTML=`<div class="panel"><p class="empty">${bkErr==='slow'?'Ainda não consegui carregar os pedidos. Confira a conexão.':bkErr==='err'?'Não foi possível carregar os pedidos.':'Carregando pedidos…'}</p></div>`; return; }
  const today=iso(new Date());
  const pend=BK.filter(b=>b.status==='pendente').sort(cmp);
  const conf=BK.filter(b=>b.status==='confirmado'&&(b.iso||'9')>=today).sort(cmp);
  const hist=BK.filter(b=>b.status!=='pendente'&&!(b.status==='confirmado'&&(b.iso||'9')>=today)).sort((a,b)=>cmp(b,a)).slice(0,12);
  const sec=(t,list,mode,empty)=>`<h3 class="lbl" style="margin-top:6px">${t}${list.length?' ('+list.length+')':''}</h3>${list.length?list.map(b=>bkCard(b,mode)).join(''):`<p class="empty" style="margin:0 0 14px">${empty}</p>`}`;
  box.innerHTML=sec('Aguardando confirmação',pend,'pend','Nenhum pedido aguardando.')+sec('Confirmados',conf,'conf','Nenhum horário confirmado.')+(hist.length?sec('Histórico',hist,'hist',''):'');
}
async function onBkClick(e){
  const act=e.target.closest('[data-act]'), back=e.target.closest('[data-back]'), del=e.target.closest('[data-del]'), go=e.target.closest('[data-go]');
  if(go){ // o link do WhatsApp abre sozinho; aqui só registramos o novo estado
    const id=go.dataset.id, st=ACT[go.dataset.go].st, b=BK.find(x=>x.id===id); if(!b||!DB) return; openAct=null;
    try{ await DB.doc('bookings/'+id).update({status:st,atualizado:Date.now()}); await syncBusy(BK.map(x=>x.id===id?{...x,status:st}:x)); }
    catch(err){ setStatus('A mensagem foi aberta, mas não consegui atualizar o pedido. Tente de novo.','err'); }
    return; }
  const msgBtn=e.target.closest('[data-msg]'), sendMsg=e.target.closest('[data-sendmsg]');
  if(act){ // um toque: abre o WhatsApp da cliente já com a mensagem e atualiza o pedido; a área da profissional continua aberta aqui
    const id=act.dataset.id, key=act.dataset.act, a=ACT[key], b=BK.find(x=>x.id===id); if(!b||!DB) return;
    const w=window.open(wa(clientNum(b.tel),fill(S.msgs[a.key],bkVars(b))),'_blank');
    if(!w){ openAct={id,act:key}; openMsg=null; paintBookings(); return; } // pop-up bloqueado: mostra o botão manual
    try{ w.opener=null; }catch(err){}
    openAct=null; openMsg=null;
    try{ await DB.doc('bookings/'+id).update({status:a.st,atualizado:Date.now()}); await syncBusy(BK.map(x=>x.id===id?{...x,status:a.st}:x));
      setStatus(({ok:'Confirmado',no:'Recusado',cancel:'Cancelado'})[key]+'. WhatsApp aberto para '+b.nome+'.','good'); }
    catch(err){ setStatus('O WhatsApp abriu, mas não consegui atualizar o pedido. Tente de novo.','err'); }
    return; }
  if(msgBtn){ openMsg=msgBtn.dataset.msg; openAct=null; msgDraft=''; paintBookings(); const t=$('#freeMsg'); if(t) t.focus(); }
  else if(sendMsg){ const b=BK.find(x=>x.id===sendMsg.dataset.sendmsg); if(!b) return;
    const w=window.open(wa(clientNum(b.tel),msgDraft.trim()),'_blank'); if(w){ try{ w.opener=null; }catch(err){} }
    openMsg=null; msgDraft=''; paintBookings(); setStatus('WhatsApp aberto para '+b.nome+'.','good'); }
  else if(back){ openAct=null; openMsg=null; msgDraft=''; paintBookings(); }
  else if(del&&DB){ try{ await DB.doc('bookings/'+del.dataset.del).delete(); }catch(err){ setStatus('Não foi possível excluir.','err'); } }
}
// o site público só recebe horários ocupados (sem nome nem telefone) e fecha esses horários para as clientes
async function syncBusy(){}
async function startDb(){
  if(dbStarted) return; dbStarted=true;
  DB=!SBOK?demoDB():(TOKEN?mkDB():null);
  if(!DB){ paintBookings(); const a=$('#rAdd'); if(a) a.disabled=true; return; }
  const timer=setTimeout(()=>{ if(!bkReady){ bkErr='slow'; paintBookings(); } },10000);
  DB.collection('bookings').onSnapshot(s=>{ BK=s.docs.map(d=>({id:d.id,...d.data()})); bkReady=true; bkErr=''; clearTimeout(timer); paintBookings(); },
    ()=>{ bkErr='err'; clearTimeout(timer); paintBookings(); });
}

function dirty(){return JSON.stringify(S)!==JSON.stringify(SAVED);}
function refresh(){
  if($('#featPv')){const keep=S.card.show; S.card.show=true; $('#featPv').innerHTML=featureHTML()||'<p class="empty">Cartão vazio.</p>'; S.card.show=keep;
    if(!keep) $('#featPv').insertAdjacentHTML('afterbegin','<p class="hint" style="margin:0 0 8px">O cartão está desligado e não aparece para as clientes.</p>');}
  MSG_KEYS.forEach(k=>{const el=$('#pv-'+k); if(el) el.innerHTML=waFmt(fill(S.msgs[k],SAMPLE));});
  const st=$('#status'); if(st&&!st.dataset.keep) {st.textContent=dirty()?'Alterações ainda não publicadas.':''; st.className='status';}
}
function setStatus(t,cls){const st=$('#status'); if(!st) return; st.textContent=t; st.className='status '+(cls||''); st.dataset.keep=cls?'1':''; if(!cls) delete st.dataset.keep;}

/* ---------- salvar = republicar a própria página com o novo estado ---------- */
function buildDoc(state){
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  const css=document.getElementById('css').textContent, code=document.getElementById('code').textContent;
  const reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  const S_='script', E_='</'+S_+'>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +'<title>'+TITLE+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
   +'<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="'+FONTS+'">\n'
   +'<style id="css">'+css+'</style>\n<div id="app"></div>\n'
   +'<'+S_+' type="application/json" id="state">'+json+E_+'\n<'+S_+' id="code">'+code+E_+'</body></html>';
}
async function save(){
  const btn=$('#save'); if(btn) btn.disabled=true; setStatus('Salvando…','');
  if(!SBOK){ SAVED=JSON.parse(JSON.stringify(S)); setStatus('Protótipo: salvo só enquanto esta página estiver aberta.','good'); if(btn) btn.disabled=false; return; }
  try{ const rest=Object.assign({},S); delete rest.busy;
    await sb('POST','/rest/v1/settings?on_conflict=id',{id:1,data:rest},true,{Prefer:'resolution=merge-duplicates,return=minimal'});
    SAVED=JSON.parse(JSON.stringify(S)); setStatus('Publicado ✓','good'); }
  catch(e){ const c=String((e&&e.message)||'').replace('sb ',''); setStatus(c==='404'?'A tabela "settings" não existe no Supabase. Rode o SQL que cria as tabelas.':c==='401'?'Sessão expirada. Saia e entre de novo na área da profissional.':c==='403'?'O Supabase bloqueou a gravação (faltam as regras/policies). Rode o SQL das regras.':'Não foi possível salvar (erro '+c+'). Confira as tabelas e regras no Supabase.','err'); }
  if(btn) btn.disabled=false;
}

/* ---------- rota ---------- */
let userOk=(async()=>{ if(!SBOK) return protoGet(); if(RT) await refreshSession(); return !!TOKEN; })();
let HASH=location.hash||'';
async function route(){
  const h=HASH;
  if(h.startsWith('#profissional')){
    $('#app').innerHTML='<p class="hint center" style="margin-top:48px">Verificando acesso…</p>';
    const ok=await userOk; if(!HASH.startsWith('#profissional')) return;
    if(!ok){ $('#app').innerHTML=brandHTML()+`<div class="panel"><h3 class="lbl">Entrar${SBOK?'':' (protótipo)'}</h3>
      <label class="field"><span>Senha</span><input type="password" id="lPass" autocomplete="current-password"></label>
      ${SBOK?'':'<p class="hint" style="margin:0 0 10px">Conecte o Supabase para ativar o login.</p>'}<p class="hint" id="lErr" style="margin:0 0 10px"></p><button class="btn" id="lGo" type="button">Entrar</button></div>
      <div class="foot-links"><a href="#">Voltar ao agendamento</a></div>`;
      $('#lPass').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#lGo').click(); } });
      $('#lGo').onclick=async()=>{ const b=$('#lGo'); b.disabled=true; $('#lErr').textContent=''; let good=false;
        if(!SBOK){ good=false; }
        else try{ const pv=$('#lPass').value; good=await login(PRO_EMAIL,pv); if(!good&&pv!==pv.trim()&&!/confirm/i.test(LERR)) good=await login(PRO_EMAIL,pv.trim()); }catch(e){ LERR='rede'; }
        if(good){ userOk=Promise.resolve(true); canEdit=true; route(); }
        else{ const m=!SBOK?'Login indisponível: Supabase não configurado.':LERR==='rede'?'Sem conexão com o Supabase. Confira a internet e a URL do projeto.':/confirm/i.test(LERR)?'O usuário existe, mas o e-mail ainda não foi confirmado no Supabase (use Confirm user).':/invalid_credentials|invalid login/i.test(LERR)?'Senha incorreta, ou o e-mail do usuário no Supabase é diferente de '+PRO_EMAIL+'.':/api key|apikey|invalid/i.test(LERR)?'Chave do Supabase inválida. Confira a chave publishable no código.':'Não foi possível entrar. ('+(LERR.trim()||'sem detalhes')+')'; $('#lErr').textContent=m; b.disabled=false; } };
      return; }
    const t=h.slice('#profissional-'.length); if(TABS.some(x=>x[0]===t)) tab=t;
    renderPro(); startDb();
  } else renderClient();
  window.scrollTo(0,0);
}
addEventListener('hashchange',()=>{ HASH=location.hash||''; route(); });
/* navegação por clique direto: funciona mesmo quando o visualizador bloqueia mudar o endereço (#) da página */
document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a[href^="#"]'); if(!a) return;
  e.preventDefault(); HASH=a.getAttribute('href')==='#'?'':a.getAttribute('href');
  try{ history.replaceState(null,'',HASH||location.pathname+location.search); }catch(err){}
  route(); });
loadSettings().then(()=>route());
userOk.then(ok=>{ if(!ok) return; canEdit=true; const f=$('#foot'); if(f) f.innerHTML=proLinkHTML();
  const fl=$('.foot-links'); if(fl&&!fl.innerHTML.trim()) fl.innerHTML=proLinkHTML(); });
})();
</script>
